<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>武汉路网与 POI 预览</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body { margin: 0; font-family: Arial, "Microsoft YaHei", sans-serif; }
    #map { width: 100vw; height: 100vh; }
    .info {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 1000;
      max-height: 80vh;
      overflow-y: auto;
      border-radius: 8px;
      padding: 12px;
      background: #fff;
      box-shadow: 0 8px 28px rgba(15, 23, 42, 0.16);
      font-size: 13px;
      line-height: 1.55;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="info" id="info">加载中...</div>
  <script>
    const map = L.map("map").setView([30.58, 114.35], 11);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 18 }).addTo(map);

    const roadColors = {
      trunk: "#f97316",
      primary: "#2563eb",
      secondary: "#16a34a",
      tertiary: "#7c3aed",
      residential: "#94a3b8",
      service: "#cbd5e1",
      track: "#e2e8f0",
      greenway: "#22c55e"
    };
    const poiColors = {
      scenic: "#ea580c",
      medical: "#e11d48",
      transit: "#0284c7",
      park: "#16a34a",
      supply: "#f59e0b"
    };

    const info = document.getElementById("info");
    const summary = [];

    fetch("/data/wuhan-roads-simplified.geojson")
      .then((response) => response.ok ? response.json() : Promise.reject())
      .then((data) => {
        const count = {};
        data.features.forEach((feature) => {
          const level = feature.properties.fclass || feature.properties.highway || "unknown";
          count[level] = (count[level] || 0) + 1;
          const coordinates = feature.geometry.type === "LineString"
            ? feature.geometry.coordinates
            : feature.geometry.coordinates[0] || [];
          L.polyline(coordinates.map((coord) => [coord[1], coord[0]]), {
            color: roadColors[level] || "#64748b",
            weight: level === "trunk" ? 2.8 : level === "primary" ? 2.4 : 1.5,
            opacity: 0.68
          }).addTo(map);
        });
        summary.push(`路网 ${data.features.length} 条<br>${Object.entries(count).map(([k, v]) => `${k}: ${v}`).join("<br>")}`);
        info.innerHTML = summary.join("<hr>");
      })
      .catch(() => {
        summary.push("未找到 /data/wuhan-roads-simplified.geojson");
        info.innerHTML = summary.join("<hr>");
      });

    fetch("/data/wuhan-pois.geojson")
      .then((response) => response.ok ? response.json() : Promise.reject())
      .then((data) => {
        const count = {};
        data.features.forEach((feature) => {
          const category = feature.properties.category || "unknown";
          count[category] = (count[category] || 0) + 1;
          L.circleMarker([feature.geometry.coordinates[1], feature.geometry.coordinates[0]], {
            radius: 4,
            color: "#1f2937",
            weight: 0.5,
            fillColor: poiColors[category] || "#64748b",
            fillOpacity: 0.85
          }).bindPopup(`${category}: ${feature.properties.name || feature.properties.fclass || ""}`).addTo(map);
        });
        summary.push(`POI ${data.features.length} 个<br>${Object.entries(count).map(([k, v]) => `${k}: ${v}`).join("<br>")}`);
        info.innerHTML = summary.join("<hr>");
      })
      .catch(() => {
        summary.push("未找到 /data/wuhan-pois.geojson");
        info.innerHTML = summary.join("<hr>");
      });
  </script>
</body>
</html>
